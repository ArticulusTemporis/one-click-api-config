name: build-and-sign

# Builds dist/aac.exe on Windows and hands it to SignPath Foundation for
# Authenticode signing, then attaches it to the release.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   SIGNPATH_API_TOKEN          from SignPath: Settings -> API Tokens
# Required repository variables:
#   SIGNPATH_ORGANIZATION_ID    GUID shown in the SignPath URL (/Web/<guid>)
#   SIGNPATH_PROJECT_SLUG       e.g. one-click-api-config
#   SIGNPATH_SIGNING_POLICY_SLUG e.g. release-signing
#   SIGNPATH_ARTIFACT_CONFIG    e.g. exe
# If the secrets are absent the job still builds, it just stays unsigned.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node scripts/build-ci.mjs

      - name: Test
        run: node --test

      - name: Upload unsigned artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: aac-unsigned
          path: dist/aac.exe
          if-no-files-found: error

      - name: Submit signing request to SignPath
        id: sign
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIG }}
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/aac.exe
            dist/signed/aac.exe
          fail_on_unmatched_files: false
